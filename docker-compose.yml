services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oss-tech-postgres
    # .env 의 값(GITHUB_TOKEN 등)은 이 서비스에 필요 없으므로 env_file 을 걸지 않는다.
    # 필요한 변수는 아래 environment 에서 ${VAR:-기본값} 으로 명시한다 (compose 가 .env 를 보간용으로 읽음).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osstech}
      POSTGRES_USER: ${POSTGRES_USER:-osstech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osstech_secret}
    ports:
      # 기본 비밀번호가 저장소에 공개돼 있으므로 같은 네트워크의 다른 기기에서 접속하지 못하게 로컬호스트에만 연다
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osstech} -d ${POSTGRES_DB:-osstech}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── Backend (Kotlin + Spring Boot) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oss-tech-backend
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-osstech}
      DB_USERNAME: ${POSTGRES_USER:-osstech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-osstech_secret}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      CRAWL_REPOS_PER_DOMAIN: ${CRAWL_REPOS_PER_DOMAIN:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16000}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_API_BASE_URL: ${CLAUDE_API_BASE_URL:-https://api.anthropic.com}
      WEBCLIENT_CONNECT_TIMEOUT_MS: ${WEBCLIENT_CONNECT_TIMEOUT_MS:-5000}
      WEBCLIENT_READ_TIMEOUT_MS: ${WEBCLIENT_READ_TIMEOUT_MS:-30000}
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend (Next.js 14) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 빌드 타임에 번들에 인라인되는 외부 URL (브라우저 → 백엔드 직접 호출 시)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8089}
    container_name: oss-tech-frontend
    # .env 의 값(GITHUB_TOKEN 등)은 이 서비스에 필요 없으므로 env_file 을 걸지 않는다.
    # 필요한 변수는 아래 environment 에서 ${VAR:-기본값} 으로 명시한다 (compose 가 .env 를 보간용으로 읽음).
    environment:
      # 서버 컴포넌트 fetch: 컨테이너 내부 통신 (Next.js rewrite 경유 안 함)
      INTERNAL_API_URL: http://backend:8080
      # canonical / hreflang / Open Graph 에 쓰이는 공개 주소 (배포 시 실제 도메인으로)
      SITE_URL: ${SITE_URL:-http://localhost:3033}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8089}
    ports:
      - "3033:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
